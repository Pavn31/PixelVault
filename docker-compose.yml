services:
  web:
    build: .
    env_file: .env
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
      - ./temporary:/app/temporary
      - staticfiles:/app/staticfiles
    depends_on:
      - db
      - redis

  worker:
    build: .
    env_file: .env
    command: celery -A config worker --loglevel=INFO --concurrency=2
    volumes:
      - ./media:/app/media
      - ./temporary:/app/temporary
    depends_on:
      - db
      - redis

  beat:
    build: .
    env_file: .env
    command: celery -A config beat --loglevel=INFO
    volumes:
      - ./media:/app/media
      - ./temporary:/app/temporary
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pixelvault}
      POSTGRES_USER: ${POSTGRES_USER:-pixelvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/usr/share/nginx/html/static:ro
    depends_on:
      - web

volumes:
  postgres_data:
  staticfiles:
